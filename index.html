<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>AD600 Elite 广告看板 · 维护中</title>
  <style>
    :root{--nav:#102c46;--ink:#17324a;--muted:#7890a3;--line:#e4ebf1;--bg:#f5f7fa;--teal:#008da5;--gold:#d79b42}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
      font:14px/1.65 system-ui,"Microsoft YaHei","PingFang SC",sans-serif;padding:28px}
    .card{width:min(620px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;
      box-shadow:0 1px 2px #102c460a;padding:34px 36px 30px}
    .brand{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
    .mark{width:40px;height:40px;border-radius:11px;background:#1d6fd8;color:#fff;display:grid;place-items:center;flex-shrink:0}
    .brand strong{display:block;font-size:16px;font-weight:700}
    .brand span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
    h1{font-size:23px;margin:24px 0 10px;letter-spacing:.2px}
    .tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#95651e;
      background:#fff2dc;border-radius:20px;padding:4px 13px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
    p{margin:0 0 12px;color:#40586f;font-size:13.5px}
    ul{margin:6px 0 0;padding-left:20px;color:#40586f;font-size:13.5px}
    li{margin-bottom:7px}
    .foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
    code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f4f7fa;border-radius:5px;padding:1px 6px;color:#3d5a73}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 20h18M6.5 20V11M12 20V4.5M17.5 20v-6.5"/></svg></span>
      <div><strong>AD600 Elite 广告看板</strong><span>美国站 · 广告运营看板</span></div>
    </div>
    <span class="tag"><span class="dot" aria-hidden="true"></span>维护中</span>
    <h1>看板正在重建，暂时下线</h1>
    <p>线上这一份正在按最新口径重做，为了避免拿到半成品数据做判断，先暂停对外访问。</p>
    <ul>
      <li>正在调整：查看周期预设、图表精简、模块职责重划</li>
      <li>数据口径不变：仍以活动日报层为基准，投放词 / 搜索词 / 广告位 / 链接流量各自独立，不跨层相加</li>
      <li>恢复后 <code>此地址</code> 会自动变回最新版看板，无需换链接</li>
    </ul>
    <p class="foot">如需看当前数据，请使用本地生成的看板文件；本地版始终是最新的。<br>维护窗口：2026-11-26 起，恢复时间以上线通知为准。</p>
  </main>
</body>
</html>
